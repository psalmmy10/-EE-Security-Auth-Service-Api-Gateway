# =====================================================================
# DEV — gateway on http://localhost:8000, auth service on http://localhost:8080
# =====================================================================
server.port=${SERVER_PORT:8000}

# Must equal the auth service's dev issuer/audience EXACTLY (app.security.jwt.* in its application-dev.properties)
app.gateway.jwt.issuer=${JWT_ISSUER:https://auth.dev.pay.local}
app.gateway.jwt.audience=${JWT_AUDIENCE:pay-api-dev}


app.gateway.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.gateway.rate-limit.limit=1000

management.endpoint.health.show-details=always
logging.level.com.pay.gateway=DEBUG
