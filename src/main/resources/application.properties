# =====================================================================
# Shared configuration for ALL environments. Activate exactly one profile:
#   spring.profiles.active=dev (local)  |  SPRING_PROFILES_ACTIVE=staging|prod (servers)
# =====================================================================
spring.profiles.active=dev
spring.application.name=pay-api-gateway

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Upstream services (internal URLs, never public) ----
app.gateway.auth-service-uri=${AUTH_SERVICE_URI:http://localhost:8080}

# ---- Edge protections ----
app.gateway.max-request-size=64KB
# Proxies in FRONT of the gateway that append X-Forwarded-For (load balancer = 1, none = 0)
app.gateway.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:0}
app.gateway.require-https=false

# Coarse per-IP limit across ALL routes (endpoint limits like 10 logins/min live in the auth service).
# Generous on purpose: many mobile users can share one carrier IP.
app.gateway.rate-limit.enabled=true
app.gateway.rate-limit.store=${RATE_LIMIT_STORE:memory}
app.gateway.rate-limit.limit=300
app.gateway.rate-limit.window=1m

# ---- Spring Cloud Gateway ----
# Disabled: they APPEND to client-supplied X-Forwarded-*; ForwardedHeadersSanitizingFilter sets clean values instead
spring.cloud.gateway.x-forwarded.enabled=false
spring.cloud.gateway.forwarded.enabled=false
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=10s
spring.cloud.gateway.httpclient.pool.max-idle-time=30s


# ---- Circuit breaker for the auth service ----
resilience4j.circuitbreaker.instances.authService.sliding-window-size=20
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=5
resilience4j.timelimiter.instances.authService.timeout-duration=12s

# ---- Redis (only used when RATE_LIMIT_STORE=redis) ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=WARN
