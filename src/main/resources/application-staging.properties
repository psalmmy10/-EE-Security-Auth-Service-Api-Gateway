# =====================================================================
# STAGING — values come from the environment; missing required ones stop startup
# =====================================================================
app.gateway.auth-service-uri=${AUTH_SERVICE_URI}
app.gateway.jwt.issuer=${JWT_ISSUER}
app.gateway.jwt.audience=${JWT_AUDIENCE}
app.gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Behind the HTTPS load balancer
app.gateway.require-https=true
app.gateway.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}

# Actuator on an INTERNAL port only
management.server.port=${MANAGEMENT_PORT:8091}

logging.level.com.pay.gateway=INFO
